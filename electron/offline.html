<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dentia sin conexion</title>
    <style>
      :root {
        color: #172033;
        background: #f5f7fb;
        font-family: Inter, "Segoe UI", sans-serif;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
      }

      main {
        width: min(460px, calc(100% - 48px));
        padding: 40px;
        border: 1px solid #dbe2ee;
        border-radius: 20px;
        background: #ffffff;
        box-shadow: 0 18px 50px rgba(28, 45, 80, 0.12);
        text-align: center;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 28px;
      }

      p {
        margin: 0 0 28px;
        color: #5f6b7e;
        line-height: 1.6;
      }

      button {
        border: 0;
        border-radius: 10px;
        padding: 12px 22px;
        color: #ffffff;
        background: #3157d5;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      button:hover {
        background: #2547bb;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>No pudimos abrir Dentia</h1>
      <p>
        Revisa tu conexion a internet e intenta nuevamente. Tus datos permanecen
        guardados en el servidor.
      </p>
      <button id="retry" type="button">Intentar de nuevo</button>
    </main>
    <script>
      document.getElementById('retry').addEventListener('click', () => {
        window.dentiaDesktop.retry()
      })
    </script>
  </body>
</html>
